plugins {
    id 'base'
}

ext.springBootVersion = '3.5.16'

subprojects {
    if (file('build.gradle').exists()) {
        apply plugin: 'java'

        repositories { mavenCentral() }

        java {
            toolchain { languageVersion = JavaLanguageVersion.of(21) }
        }

        dependencies {
            implementation platform("org.springframework.boot:spring-boot-dependencies:${rootProject.springBootVersion}")
            implementation 'org.springframework.boot:spring-boot-starter-web'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs += '-parameters'
        }
        tasks.withType(Test).configureEach { useJUnitPlatform() }
    }
}

tasks.register('repositoryCheck', Exec) {
    commandLine 'python3', 'tools/check_repository.py'
}

tasks.named('check') {
    dependsOn 'repositoryCheck'
    dependsOn subprojects.collect { it.tasks.matching { task -> task.name == 'check' } }
}

// Opt-in because the real book launchers deliberately use fixed ports 9000–9002.
tasks.register('smokeLaunchers', Exec) {
    dependsOn subprojects.collect { project -> project.tasks.matching { task -> task.name == 'installDist' } }
    commandLine 'python3', 'tools/smoke_launchers.py'
}
