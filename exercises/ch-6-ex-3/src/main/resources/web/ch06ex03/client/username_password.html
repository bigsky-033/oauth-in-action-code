<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource owner credentials</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Resource owner credentials</h1><p>This chapter demonstrates sending user credentials through the client.</p>
<form action="/username_password" method="post">
<label>Username <input name="username" autocomplete="username" value="alice" required></label>
<label>Password <input name="password" type="password" autocomplete="current-password" value="password" required></label>
<button type="submit">Request token</button></form><p>Demo users: Alice / password; Bob / this is my secret password; Carol / user password!</p>
</main></body></html>
